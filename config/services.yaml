# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    kafka_gateway_url: '%env(KAFKA_GATEWAY_URL)%'           # Домен куда шлем сообщеня
    kafka_mail_send_path_api: 'kafka/mail-send'             # Путь по которому шлем

    dictionary_service_url: '%env(DICTIONARY_SERVICE_URL)%'# Домен по которому работает API словарей

    app.timezone: '%env(APP_TIMEZONE)%'                     # Тайм зона для микросервиса
    db_schema: '%env(DB_SCHEMA)%'                           # Схема Postgresql с которой работает микросервис

    app.name: '%env(APP_NAME)%'                             # Имя микросервиса
    app.version: '%env(APP_VERSION)%'                       # Версия сборки

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    redis:
        class: Predis\Client
        factory: ['App\Infrastructure\Redis\RedisFactory', 'create']
        arguments:
            - '%env(REDIS_URL)%'
            - '%env(default::REDIS_PASSWORD)%'
            - '%env(default::REDIS_SSL_CA)%'

    # ---- Mappers ----
    App\Application\Email\Verification\Mapper\VerificationEmailMapper: ~

    # ---- EventSubscriber ----
    App\EventSubscriber\:
        resource: '../src/EventSubscriber'
        tags: [ 'kernel.event_subscriber' ]

    # ------------------- Service name & Version    ------------
    App\Infrastructure\Application\ApplicationInfo:
        arguments:
            $name: '%app.name%'
            $version: '%app.version%'

    # ------------------- Time checker class    ----------------
    App\Shared\Time\ClockInterface:
        alias: App\Shared\Time\SystemClock

    App\Shared\Time\SystemClock:
        arguments:
            $timezone: '%app.timezone%'

    App\Infrastructure\Email\Sender\SymfonyMailerEmailSender:
        arguments:
            $fromEmail: '%env(MAIL_FROM_ADDRESS)%'
            $fromName: '%env(MAIL_FROM_NAME)%'

    App\Infrastructure\Dictionary\HttpDictionaryProvider:
        arguments:
            $baseUrl: '%dictionary_service_url%'
